# Render Blueprint: one web service runs the API and serves the built web app on
# the same origin. The database is Neon Postgres (DATABASE_URL, entered once in
# the Render dashboard). See docs/DEPLOYMENT.md.
services:
  - type: web
    name: spu-events
    runtime: node
    plan: free
    region: ohio
    branch: main
    # Dev dependencies (Vite, tsup) are needed to build, so include them despite NODE_ENV.
    buildCommand: npm ci --include=dev && npm run build
    # Migrate (and seed demo data into an empty database), then start.
    startCommand: npm run release -w @spu-events/api && npm start -w @spu-events/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      # Public demo: visitors sign in with one click, and the data is wiped and
      # re-seeded every 6 hours. Remove this before the data ever matters.
      - key: DEMO_RESET_HOURS
        value: '6'
      - key: SESSION_SECRET
        generateValue: true
      - key: TICKET_SIGNING_SECRET
        generateValue: true
      # Render's disk is wiped on every deploy, so uploads live in Postgres.
      - key: STORAGE
        value: database
      - key: WEB_DIST_DIR
        value: ../web/dist
